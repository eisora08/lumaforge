name: Build Linux

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DepotDownloader/DepotDownloader.csproj

      - name: Build Linux x64
        run: >
          dotnet publish DepotDownloader/DepotDownloader.csproj
          --configuration Release
          -p:PublishSingleFile=true
          -p:DebugType=embedded
          --self-contained
          --runtime linux-x64
          -o out/

      - name: Zip output
        run: cd out && zip -j ../DepotDownloaderMod-linux-x64.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DepotDownloaderMod-linux-x64
          path: DepotDownloaderMod-linux-x64.zip

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-build-${{ github.run_number }}
          name: Linux Build ${{ github.run_number }}
          files: DepotDownloaderMod-linux-x64.zip
          generate_release_notes: true
          prerelease: false
