<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification</title>
  <style>
    @font-face {
      font-family: 'InterVariable';
      src: url('/fonts/InterVariable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "InterVariable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-optical-sizing: auto;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    #toast-container {
      padding: 18px;
      width: 100%;
    }

    .toast {
      min-width: 340px;
      max-width: 420px;
      border-radius: 24px;
      padding: 16px 20px;
      position: relative;
      overflow: hidden;
      background: rgba(48, 43, 47, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(184, 215, 220, 0.12),
        0 0 28px rgba(184, 215, 220, 0.06);
      animation: toastEntry 280ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .toast.exit {
      animation: toastExit 240ms ease-in forwards;
    }

    .toast.achieve {
      width: 320px;
      min-width: 320px;
      max-width: 320px;
      border-radius: 16px;
      padding: 12px 16px;
      background: color-mix(in srgb, var(--ach-bg) 95%, transparent);
      border: 1px solid var(--ach-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: achEntry 380ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .toast.achieve.exit {
      animation: achFadeOut 180ms ease-in forwards;
    }

    .toast.achieve .ach-icon-container {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--ach-accent) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--ach-accent) 20%, transparent);
      color: var(--ach-accent);
    }

    .toast.achieve .ach-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ach-accent);
      margin: 0;
    }

    .toast.achieve .ach-name {
      margin: 2px 0 0;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--ach-text);
      word-wrap: break-word;
    }

    .toast.achieve .ach-meta {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toast.achieve .ach-game-title {
      font-size: 10px;
      font-weight: 500;
      color: color-mix(in srgb, var(--ach-muted) 70%, transparent);
    }

    .toast.achieve .ach-bullet {
      font-size: 10px;
      color: color-mix(in srgb, var(--ach-muted) 30%, transparent);
    }

    .toast.achieve .ach-desc {
      margin: 2px 0 0;
      font-size: 11px;
      line-height: 1.4;
      color: color-mix(in srgb, var(--ach-muted) 70%, transparent);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Rare — border glow + breathing brightness */
    .toast.achieve.achieve-rare {
      border-width: 2px;
      animation: achEntry 380ms cubic-bezier(0.16, 1, 0.3, 1) both,
                 achRareGlow 2s ease-in-out 400ms infinite alternate;
    }

    /* Platinum — violet glow + pulsing ring + gradient text */
    .toast.achieve.achieve-platinum {
      border-width: 2px;
      border-color: rgba(167, 139, 250, 0.9) !important;
      animation: achEntry 380ms cubic-bezier(0.16, 1, 0.3, 1) both,
                 achRareGlow 2s ease-in-out 400ms infinite alternate;
    }

    .toast.achieve.achieve-platinum .ach-icon-container {
      animation: achPlatRing 1.5s ease-in-out infinite;
    }

    .toast.achieve.achieve-platinum .ach-header {
      background: linear-gradient(90deg, #a78bfa, #8b5cf6, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @keyframes achEntry {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes achFadeOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(16px); }
    }

    @keyframes achRareGlow {
      from { filter: brightness(1); }
      to { filter: brightness(1.08); }
    }

    @keyframes achPlatRing {
      0%, 100% { box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.5); }
      50% { box-shadow: 0 0 18px 3px rgba(167, 139, 250, 0.35); }
    }

    .toast.achieve .ach-close-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: color-mix(in srgb, var(--ach-muted) 50%, transparent);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .toast.achieve .ach-close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--ach-text);
    }

    @keyframes toastEntry {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toastExit {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }
    }

    .toast.session {
      width: 420px;
      min-width: 420px;
      max-width: 420px;
      border-radius: 18px;
      padding: 0;
      overflow: hidden;
      position: relative;
      background: color-mix(in srgb, var(--ach-surface) 15%, var(--ach-bg));
      border: 1px solid var(--ach-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: achToastEntry 420ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .toast.session.exit {
      animation: sessionExit 280ms cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    /* Glow ring — accent-colored border glow */
    .toast.session::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 19px;
      background: linear-gradient(135deg, var(--ach-accent, #b8d7dc), transparent 50%);
      opacity: 0;
      animation: sessionGlowIn 1.5s 0.4s ease-out forwards;
      z-index: -1;
      pointer-events: none;
    }

    /* Shimmer sweep — light streak across card */
    .toast.session::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.07), transparent);
      animation: shimmerSweep 1.4s 0.35s ease-out forwards;
      z-index: 10;
      pointer-events: none;
    }

    .session-image-wrap {
      height: 220px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      position: relative;
    }

    .session-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: kenBurns 5s ease-in-out forwards;
      transform-origin: center center;
    }

    .session-image-wrap .session-img-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--ach-surface, #302b2f), transparent);
    }

    .session-icon-fallback {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      color: var(--ach-muted, #9ca3af);
    }

    .session-body {
      padding: 14px 20px 16px;
      text-align: center;
    }

    .session-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ach-text, #fff);
      line-height: 1.3;
      word-wrap: break-word;
    }

    .session-status {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .session-status-icon-launch {
      color: #34d399;
      animation: playPulse 1.5s ease-in-out 0.6s infinite;
    }

    .session-status-icon-end {
      color: var(--ach-muted, #9ca3af);
      animation: checkDrawIn 0.5s 0.3s ease-out forwards;
    }

    .session-status-label {
      font-size: 13px;
      font-weight: 500;
    }

    .session-status-label.launch {
      color: #6ee7b7;
    }

    .session-status-label.end {
      color: var(--ach-muted, #9ca3af);
    }

    .session-duration {
      font-weight: 600;
      color: var(--ach-text, #fff);
    }

    .session-close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: none;
      background: rgba(0, 0, 0, 0.4);
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      z-index: 20;
    }

    .session-close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    @media (prefers-reduced-motion: reduce) {
      .toast.achieve {
        animation: achFadeIn 300ms ease-out forwards !important;
      }

      .toast.session {
        animation: achFadeIn 300ms ease-out forwards !important;
      }

      .toast.session.exit {
        animation: achFadeOut 200ms ease-in forwards !important;
      }

      .toast.session .session-image-wrap img {
        animation: none !important;
      }

      .toast.session::before,
      .toast.session::after {
        animation: none !important;
      }

      .session-status-icon-launch {
        animation: none !important;
      }

      .session-status-icon-end {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        opacity: 1 !important;
      }

      .toast.achieve.exit {
        animation: achFadeOut 200ms ease-in forwards !important;
      }
    }

    @keyframes achFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes achFadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    @keyframes achToastEntry {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
        filter: blur(8px);
      }
      60% {
        opacity: 1;
        filter: blur(0);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes achToastExit {
      from {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0);
      }
      to {
        opacity: 0;
        transform: translateX(20px) scale(0.98);
        filter: blur(4px);
      }
    }

    @keyframes sessionExit {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
      to {
        opacity: 0;
        transform: translateY(-10px) scale(0.97);
        filter: blur(5px);
      }
    }

    @keyframes kenBurns {
      from { transform: scale(1); }
      to   { transform: scale(1.06); }
    }

    @keyframes shimmerSweep {
      from { left: -120%; }
      to   { left: 160%; }
    }

    @keyframes sessionGlowIn {
      from { opacity: 0; }
      50%  { opacity: 0.2; }
      to   { opacity: 0.1; }
    }

    @keyframes playPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.18); opacity: 0.85; }
    }

    @keyframes checkDrawIn {
      from { stroke-dashoffset: 24; opacity: 0; }
      50%  { opacity: 1; }
      to   { stroke-dashoffset: 0; opacity: 1; }
    }

    .toast-glow {
      position: absolute;
      left: -64px;
      top: -64px;
      width: 128px;
      height: 128px;
      border-radius: 9999px;
      pointer-events: none;
    }

    .toast-accent-bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 3px;
      pointer-events: none;
    }

    .toast-body {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .toast-icon-wrap {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.045);
    }

    .toast-icon-wrap svg {
      width: 20px;
      height: 20px;
    }

    .toast-content {
      flex: 1;
      min-width: 0;
    }

    .toast-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      color: #fff;
    }

    .toast-message {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.25;
      color: #9ca3af;
      opacity: 0.8;
    }

    .toast-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      pointer-events: none;
    }

    .toast-progress-fill {
      height: 100%;
      transform-origin: left;
    }

    @keyframes toastProgress {
      from {
        transform: scaleX(1);
      }

      to {
        transform: scaleX(0);
      }
    }

    /* Position classes — override body flex alignment */
    body.pos-top-right    { justify-content: flex-end;  align-items: flex-start; }
    body.pos-top-left     { justify-content: flex-start; align-items: flex-start; }
    body.pos-bottom-right { justify-content: flex-end;  align-items: flex-end;   }
    body.pos-bottom-left  { justify-content: flex-start; align-items: flex-end;   }
    body.pos-top-center   { justify-content: center;    align-items: flex-start; }
    body.pos-bottom-center{ justify-content: center;    align-items: flex-end;   }

    /* Variant configs (injected via JS) */
  </style>
</head>

<body>
  <div id="toast-container"></div>
  <script>
    window.__showToast = function (data) {
      var container = document.getElementById('toast-container');
      // Remove existing toast with exit animation
      var existing = container.querySelector('.toast');
      if (existing) {
        existing.classList.add('exit');
        setTimeout(function () { existing.remove(); }, 300);
      }

      var variant = data.variant || 'info';
      var configs = {
        success: {
          icon: 'check',
          iconColor: '#6ee7b7',
          glow: 'rgba(52,211,153,0.25)',
          accent: 'linear-gradient(90deg, #34d399, #4ade80, #10b981)',
        },
        error: {
          icon: 'shield',
          iconColor: '#fca5a5',
          glow: 'rgba(251,113,133,0.25)',
          accent: 'linear-gradient(90deg, #fb7185, #f87171, #ec4899)',
        },
        warning: {
          icon: 'alert',
          iconColor: '#fcd34d',
          glow: 'rgba(251,146,60,0.25)',
          accent: 'linear-gradient(90deg, #fbbf24, #fb923c, #eab308)',
        },
        info: {
          icon: 'info',
          iconColor: '#7dd3fc',
          glow: 'rgba(34,211,238,0.25)',
          accent: 'linear-gradient(90deg, #7dd3fc, #22d3ee, #3b82f6)',
        },
      };
      var cfg = configs[variant] || configs.info;

      var iconSvg = '';
      if (cfg.icon === 'check') {
        iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + cfg.iconColor + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
      } else if (cfg.icon === 'shield') {
        iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + cfg.iconColor + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>';
      } else if (cfg.icon === 'alert') {
        iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + cfg.iconColor + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
      } else {
        iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + cfg.iconColor + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
      }

      var toast = document.createElement('div');
      toast.className = 'toast';

      // Apply theme colors from data
      if (data.theme) {
        var t = data.theme;

        toast.style.background = t.surfaceActive || 'rgba(48,43,47,0.95)';
        toast.style.borderColor = t.surfaceBorder || 'rgba(255,255,255,0.1)';

        if (t.surfaceBlur && t.surfaceBlur !== 'none') {
          toast.style.backdropFilter = t.surfaceBlur;
          toast.style.webkitBackdropFilter = t.surfaceBlur;
        }

        if (t.colorText) toast.style.setProperty('color', t.colorText);
        if (t.colorMuted) toast.style.setProperty('--toast-muted', t.colorMuted);
        // Add accent glow
        var accent = t.colorAccent || '#b8d7dc';
        toast.style.boxShadow =
          '0 24px 70px rgba(0,0,0,0.45), 0 0 0 1px ' + accent + '12, 0 0 28px' + accent + '06';
      }

      toast.innerHTML =
        '<div class="toast-glow" style="background:' + cfg.glow + '"></div>' +
        '<div class="toast-accent-bar" style="background:' + cfg.accent + '"></div>' +
        '<div class="toast-body">' +
        '<div class="toast-icon-wrap" style="border-color:' + (data.theme ? data.theme.surfaceBorder || 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.1)') + ';background:' + (data.theme ? data.theme.surfaceActive || 'rgba(255,255,255,0.045)' : 'rgba(255,255,255,0.045)') + '">' +
        iconSvg +
        '</div>' +
        '<div class="toast-content">' +
        '<div class="toast-title" style="color:' + (data.theme ? data.theme.colorText || '#fff' : '#fff') + '">' + escapeHtml(data.title || '') + '</div>' +
        '<div class="toast-message" style="color:' + (data.theme ? data.theme.colorMuted || '#9ca3af' : '#9ca3af') + '">' + escapeHtml(data.message || '') + '</div>' +
        '</div>' +
        '</div>' +
        '<div class="toast-progress-track" style="background:' + (data.theme ? data.theme.surfaceBorder || 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.1)') + '">' +
        '<div class="toast-progress-fill" style="background:' + cfg.accent + ';animation:toastProgress ' + (data.duration || 2800) + 'ms linear forwards"></div>' +
        '</div>';

      container.appendChild(toast);

      var duration = data.duration || 2800;
      // Clear any existing timer
      if (window.__toastTimer) clearTimeout(window.__toastTimer);
      // Auto-dismiss
      window.__toastTimer = setTimeout(function () {
        toast.classList.add('exit');
        setTimeout(function () {
          if (toast.parentNode) toast.remove();
        }, 300);
      }, duration);
    };

    function applyThemeVars(vars) {
      if (!vars) return;
      var root = document.documentElement;
      root.style.setProperty('--ach-bg', vars['--color-bg'] || '#181114');
      root.style.setProperty('--ach-text', vars['--color-text'] || '#ffffff');
      root.style.setProperty('--ach-muted', vars['--color-muted'] || '#9ca3af');
      root.style.setProperty('--ach-accent', vars['--color-accent'] || '#b8d7dc');
      root.style.setProperty('--ach-border', vars['--surface-active-border'] || 'rgba(255,255,255,0.1)');
      root.style.setProperty('--ach-surface', vars['--surface-active'] || '#302b2f');
    }

    function parseRgb(colorStr) {
      if (!colorStr) return null;
      var match = colorStr.match(/rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if (match) return { r: match[1], g: match[2], b: match[3] };
      if (colorStr.startsWith('#')) {
        var hex = colorStr.slice(1);
        if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
        if (hex.length === 6) {
          return {
            r: parseInt(hex.slice(0, 2), 16).toString(),
            g: parseInt(hex.slice(2, 4), 16).toString(),
            b: parseInt(hex.slice(4, 6), 16).toString(),
          };
        }
      }
      return null;
    }

    function setOverlayPosition(pos) {
      var valid = ["top-right","top-left","bottom-right","bottom-left","top-center","bottom-center"];
      var cls = valid.indexOf(pos) !== -1 ? "pos-" + pos : "pos-top-right";
      document.body.className = cls;
    }

    // Achievements — premium toast with rarity tiers + description
    window.__showAchievementToast = function (data) {
      console.log("[ACH][OVERLAY][WEB] __showAchievementToast called", JSON.stringify(data));
      var container = document.getElementById('toast-container');
      // Remove existing toast with exit animation
      var existing = container.querySelector('.toast');
      if (existing) {
        existing.classList.add('exit');
        setTimeout(function () { existing.remove(); }, 300);
      }

      setOverlayPosition(data.overlayPosition);
      applyThemeVars(data.themeVars);

      var duration = data.duration || 4500;
      var rarity = (data.rarity != null && Number.isFinite(data.rarity)) ? data.rarity : null;

      // Rarity tier classification
      function getRarityTier(pct) {
        if (pct === null || pct <= 0) return null;
        if (pct === 100 || data.isPlatinum) return 'platinum';
        if (pct <= 1) return 'gold';
        if (pct <= 5) return 'silver';
        if (pct <= 10) return 'bronze';
        return null;
      }
      var tier = getRarityTier(rarity);

      // Rarity colors
      var tierConfig = {
        platinum: { border: '#a78bfa', glow: 'rgba(167,139,250,0.6)', badgeBg: 'rgba(167,139,250,0.2)', badgeBorder: 'rgba(167,139,250,0.7)', badgeText: '#c4b5fd', label: 'Platinum Trophy', iconRing: 'rgba(167,139,250,0.5)', accentGrad: 'linear-gradient(90deg, #a78bfa, #8b5cf6, #7c3aed)' },
        gold:   { border: '#f9c74f', glow: 'rgba(249,199,79,0.55)', badgeBg: 'rgba(249,199,79,0.15)', badgeBorder: 'rgba(249,199,79,0.6)', badgeText: '#ffe08a', label: 'Ultra Rare', iconRing: 'rgba(249,199,79,0.4)', accentGrad: 'linear-gradient(90deg, #f9c74f, #f8961e)' },
        silver: { border: '#c7d0d9', glow: 'rgba(199,208,217,0.5)', badgeBg: 'rgba(199,208,217,0.15)', badgeBorder: 'rgba(199,208,217,0.6)', badgeText: '#edf3f8', label: 'Rare', iconRing: 'rgba(199,208,217,0.4)', accentGrad: 'linear-gradient(90deg, #c7d0d9, #94a3b8)' },
        bronze: { border: '#cd7f32', glow: 'rgba(205,127,50,0.5)', badgeBg: 'rgba(205,127,50,0.15)', badgeBorder: 'rgba(205,127,50,0.6)', badgeText: '#efb475', label: 'Uncommon', iconRing: 'rgba(205,127,50,0.4)', accentGrad: 'linear-gradient(90deg, #cd7f32, #b8860b)' },
      };
      var tc = tier ? tierConfig[tier] : null;
      var isRare = !!tc;

      // Icon HTML
      var iconHtml = '';
      if (data.iconUrl) {
        iconHtml = '<img src="' + escapeHtml(data.iconUrl) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px" onerror="this.style.display=\'none\'"/>';
      } else {
        iconHtml = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>';
      }

      // Rarity label
      var rarityLabelHtml = '';
      if (isRare) {
        rarityLabelHtml = '<span class="ach-header" style="color:' + tc.badgeText + '">' + tc.label + ' Achievement</span>';
      } else {
        rarityLabelHtml = '<span class="ach-header">Achievement Unlocked</span>';
      }

      // Description
      var descHtml = '';
      if (data.description) {
        descHtml = '<p class="ach-desc">' + escapeHtml(data.description) + '</p>';
      }

      // Meta line (game title only — no rarity percent)
      var metaDiv = '<div class="ach-meta">';
      if (data.gameTitle) metaDiv += '<span class="ach-game-title">' + escapeHtml(data.gameTitle) + '</span>';
      metaDiv += '</div>';

      var toast = document.createElement('div');
      toast.className = 'toast achieve' + (tier === 'platinum' ? ' achieve-platinum' : (isRare ? ' achieve-rare' : ''));
      toast.innerHTML =
        '<div class="toast-body" style="align-items:flex-start">' +
          '<div class="ach-icon-container" style="border-color:' + (tc ? tc.iconRing : 'rgba(255,255,255,0.1)') + '">' +
            iconHtml +
          '</div>' +
          '<div style="flex:1;min-width:0">' +
            rarityLabelHtml +
            '<p class="ach-name">' + escapeHtml(data.name) + '</p>' +
            descHtml +
            metaDiv +
          '</div>' +
          '<button type="button" class="ach-close-btn" onclick="dismissToast(this.closest(\'.toast\'))" aria-label="Dismiss">' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>' +
        '</div>';

      // Set dynamic box-shadow with rarity glow
      var accent = data.themeVars ? (data.themeVars['--color-accent'] || '#b8d7dc') : '#b8d7dc';
      var rgb = parseRgb(accent);
      if (isRare) {
        var trgb = parseRgb(tc.border);
        toast.style.boxShadow =
          '0 25px 50px -12px rgba(0,0,0,0.25), ' +
          '0 0 0 1px rgba(' + trgb.r + ',' + trgb.g + ',' + trgb.b + ',0.8), ' +
          '0 0 16px rgba(' + trgb.r + ',' + trgb.g + ',' + trgb.b + ',0.55)';
        toast.style.borderColor = tc.border;
        toast.classList.add('achieve-rare');
      } else if (rgb) {
        toast.style.boxShadow =
          '0 25px 50px -12px rgba(0,0,0,0.25), ' +
          '0 0 0 1px rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.12), ' +
          '0 0 28px rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.06)';
      }

      container.appendChild(toast);

      // Clear any existing timer
      if (window.__toastTimer) clearTimeout(window.__toastTimer);
      // Auto-dismiss
      window.__toastTimer = setTimeout(function () {
        toast.classList.add('exit');
        setTimeout(function () {
          if (toast.parentNode) toast.remove();
        }, 300);
      }, duration);
    };

    // ── Batch achievement toasts — staggered entry + sequential exit ──
    window.__showAchievementBatchToast = function (data) {
      console.log("[ACH][OVERLAY_BATCH][WEB] __showAchievementBatchToast called count=" + (data.toasts ? data.toasts.length : 0));
      var container = document.getElementById('toast-container');

      // Cancel any pending batch exit timers
      if (window.__batchExitTimers) {
        for (var ci = 0; ci < window.__batchExitTimers.length; ci++) {
          clearTimeout(window.__batchExitTimers[ci]);
        }
      }
      window.__batchExitTimers = [];

      // Remove any existing toasts
      var existing = container.querySelectorAll('.toast');
      for (var i = 0; i < existing.length; i++) {
        existing[i].classList.add('exit');
      }
      if (existing.length > 0) {
        setTimeout(function () {
          for (var j = 0; j < existing.length; j++) {
            if (existing[j].parentNode) existing[j].parentNode.removeChild(existing[j]);
          }
        }, 300);
      }

      setOverlayPosition(data.overlayPosition);
      applyThemeVars(data.themeVars);

      var toasts = data.toasts || [];
      var perToastDuration = data.maxDuration || 4500;
      var staggerMs = 120;

      function getRarityTier(pct, isPlatinum) {
        if (pct === null || pct <= 0) return null;
        if (pct === 100 || isPlatinum) return 'platinum';
        if (pct <= 1) return 'gold';
        if (pct <= 5) return 'silver';
        if (pct <= 10) return 'bronze';
        return null;
      }

      var tierConfig = {
        platinum: { border: '#a78bfa', glow: 'rgba(167,139,250,0.6)', iconRing: 'rgba(167,139,250,0.5)', badgeText: '#c4b5fd', label: 'Platinum Trophy' },
        gold:   { border: '#f9c74f', glow: 'rgba(249,199,79,0.55)', iconRing: 'rgba(249,199,79,0.4)', badgeText: '#ffe08a', label: 'Ultra Rare' },
        silver: { border: '#c7d0d9', glow: 'rgba(199,208,217,0.5)', iconRing: 'rgba(199,208,217,0.4)', badgeText: '#edf3f8', label: 'Rare' },
        bronze: { border: '#cd7f32', glow: 'rgba(205,127,50,0.5)', iconRing: 'rgba(205,127,50,0.4)', badgeText: '#efb475', label: 'Uncommon' },
      };

      var toastElements = [];

      for (var k = 0; k < toasts.length; k++) {
        var t = toasts[k];
        var rarity = (t.rarity != null && Number.isFinite(t.rarity)) ? t.rarity : null;
        var tier = getRarityTier(rarity, t.isPlatinum);
        var tc = tier ? tierConfig[tier] : null;
        var isRare = !!tc;

        var iconHtml = '';
        if (t.iconUrl) {
          iconHtml = '<img src="' + escapeHtml(t.iconUrl) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px" onerror="this.style.display=\'none\'"/>';
        } else {
          iconHtml = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>';
        }

        var rarityLabelHtml = isRare
          ? '<span class="ach-header" style="color:' + tc.badgeText + '">' + tc.label + ' Achievement</span>'
          : '<span class="ach-header">Achievement Unlocked</span>';

        var descHtml = t.description ? '<p class="ach-desc">' + escapeHtml(t.description) + '</p>' : '';
        var metaDiv = '<div class="ach-meta">';
        if (t.gameTitle) metaDiv += '<span class="ach-game-title">' + escapeHtml(t.gameTitle) + '</span>';
        metaDiv += '</div>';

        var toast = document.createElement('div');
        toast.className = 'toast achieve' + (tier === 'platinum' ? ' achieve-platinum' : (isRare ? ' achieve-rare' : ''));
        toast.style.animationDelay = (k * staggerMs) + 'ms';
        toast.style.opacity = '0';
        toast.innerHTML =
          '<div class="toast-body" style="align-items:flex-start">' +
            '<div class="ach-icon-container" style="border-color:' + (tc ? tc.iconRing : 'rgba(255,255,255,0.1)') + '">' +
              iconHtml +
            '</div>' +
            '<div style="flex:1;min-width:0">' +
              rarityLabelHtml +
              '<p class="ach-name">' + escapeHtml(t.name) + '</p>' +
              descHtml +
              metaDiv +
            '</div>' +
            '<button type="button" class="ach-close-btn" onclick="dismissBatchToast(this.closest(\'.toast\'))" aria-label="Dismiss">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
            '</button>' +
          '</div>';

        var accent = data.themeVars ? (data.themeVars['--color-accent'] || '#b8d7dc') : '#b8d7dc';
        var rgb = parseRgb(accent);
        if (isRare) {
          var trgb = parseRgb(tc.border);
          toast.style.boxShadow =
            '0 25px 50px -12px rgba(0,0,0,0.25), ' +
            '0 0 0 1px rgba(' + trgb.r + ',' + trgb.g + ',' + trgb.b + ',0.8), ' +
            '0 0 16px rgba(' + trgb.r + ',' + trgb.g + ',' + trgb.b + ',0.55)';
          toast.style.borderColor = tc.border;
          toast.classList.add('achieve-rare');
        } else if (rgb) {
          toast.style.boxShadow =
            '0 25px 50px -12px rgba(0,0,0,0.25), ' +
            '0 0 0 1px rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.12), ' +
            '0 0 28px rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.06)';
        }

        container.appendChild(toast);
        toastElements.push(toast);
      }

      // Staggered exit: each toast dismisses individually, in order
      function dismissSingle(toastEl) {
        if (!toastEl || toastEl._dismissed) return;
        toastEl._dismissed = true;
        toastEl.classList.add('exit');
        setTimeout(function () {
          if (toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
        }, 250);
      }

      window.__batchExitTimers = [];
      for (var m = 0; m < toastElements.length; m++) {
        var delay = perToastDuration + (m * staggerMs);
        var timer = setTimeout((function(el) {
          return function() { dismissSingle(el); };
        })(toastElements[m]), delay);
        window.__batchExitTimers.push(timer);
      }

      // Close window after the last toast exits + buffer
      var totalMs = perToastDuration + (toastElements.length * staggerMs) + 400;
      window.__batchCloseTimer = setTimeout(function () {
        try { window.__TAURI_INTERNALS__.invoke('close_toast_window'); } catch (_) {}
      }, totalMs);
    };

    // Dismiss a single toast from the batch (close button) without closing the whole window
    function dismissBatchToast(toastEl) {
      if (!toastEl) return;
      toastEl.classList.add('exit');
      setTimeout(function () {
        if (toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
      }, 250);
    }

    // Session overlay — matches GameSessionOverlay.tsx
    window.__showSessionToast = function (data) {
      console.log("[SESSION][OVERLAY][WEB] __showSessionToast called", JSON.stringify(data));
      var container = document.getElementById('toast-container');
      var existing = container.querySelector('.toast');
      if (existing) {
        existing.classList.add('exit');
        setTimeout(function () { existing.remove(); }, 300);
      }

      setOverlayPosition(data.overlayPosition);
      applyThemeVars(data.themeVars);

      var duration = data.duration || 4000;
      var isLaunch = data.sessionType === 'launch';

      // Image or fallback icon
      var imageHtml = '';
      if (data.imageUrl) {
        imageHtml =
          '<div class="session-image-wrap">' +
            '<img src="' + escapeHtml(data.imageUrl) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'"/>' +
            '<div class="session-img-fade"></div>' +
          '</div>';
      } else {
        imageHtml =
          '<div class="session-icon-fallback">' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>' +
              '<path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>' +
              '<path d="M4 22h16"/>' +
              '<path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>' +
              '<path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>' +
              '<path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>' +
            '</svg>' +
          '</div>';
      }

      // Provider label
      var providerStr = '';
      if (data.provider) {
        providerStr = ' (' + escapeHtml(data.provider) + ')';
      }

      // Status line
      var statusHtml = '';
      if (isLaunch) {
        statusHtml =
          '<div class="session-status">' +
            '<svg class="session-status-icon-launch" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
            '<span class="session-status-label launch">Playtime starting!</span>' +
          '</div>';
      } else {
        var durStr = '';
        if (data.durationSeconds != null && data.durationSeconds > 0) {
          var s = data.durationSeconds;
          if (s < 60) {
            durStr = s + ' second' + (s !== 1 ? 's' : '');
          } else {
            var m = Math.floor(s / 60);
            var secs = s % 60;
            if (m < 60) {
              durStr = m + ' min' + (secs > 0 ? ' ' + secs + ' sec' : '');
            } else {
              var h = Math.floor(m / 60);
              var mins = m % 60;
              durStr = h + 'h ' + mins + 'm';
            }
          }
        } else {
          durStr = 'a while';
        }
        statusHtml =
          '<div class="session-status">' +
            '<svg class="session-status-icon-end" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:24;stroke-dashoffset:24"><polyline points="20 6 9 17 4 12"/></svg>' +
            '<span class="session-status-label end">You played for <span class="session-duration">' + escapeHtml(durStr) + '</span></span>' +
          '</div>';
      }

      var toast = document.createElement('div');
      toast.className = 'toast session';
      toast.innerHTML =
        '<button type="button" class="session-close-btn" onclick="dismissToast(this.closest(\'.toast\'))" aria-label="Dismiss">' +
          '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
        imageHtml +
        '<div class="session-body">' +
          '<div class="session-title">' + escapeHtml(data.gameTitle) + providerStr + '</div>' +
          statusHtml +
        '</div>';

      var accent = data.themeVars ? (data.themeVars['--color-accent'] || '#b8d7dc') : '#b8d7dc';
      var rgb = parseRgb(accent);
      if (rgb) {
        toast.style.boxShadow =
          '0 25px 50px -12px rgba(0,0,0,0.25), ' +
          '0 0 0 1px rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.12), ' +
          '0 0 28px rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.06)';
      }

      container.appendChild(toast);

      if (window.__toastTimer) clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () {
        toast.classList.add('exit');
        setTimeout(function () {
          if (toast.parentNode) toast.remove();
        }, 300);
      }, duration);
    };

    function dismissToast(toast) {
      if (!toast) return;

      if (window.__toastTimer) {
        clearTimeout(window.__toastTimer);
        window.__toastTimer = null;
      }
      if (window.__batchCloseTimer) {
        clearTimeout(window.__batchCloseTimer);
        window.__batchCloseTimer = null;
      }

      toast.classList.add('exit');

      try {
        window.__TAURI_INTERNALS__.invoke('close_toast_window');
      } catch (_) {}

      setTimeout(function () {
        if (toast.parentNode) toast.remove();
      }, 300);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
