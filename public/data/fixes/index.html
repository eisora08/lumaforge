<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumaForge Fixes Catalog</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #14161e;
      --surface-2: #1a1d28;
      --border: rgba(255,255,255,0.06);
      --text: #e4e6ec;
      --text-muted: #7c7f8a;
      --accent: #60cdff;
      --accent-dim: rgba(96,205,255,0.12);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.12);
      --amber: #fbbf24;
      --amber-dim: rgba(251,191,36,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(96,205,255,0.04) 0%, transparent 100%);
    }
    .header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.35rem; }
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-muted); font-size: 0.9rem; }
    .controls {
      max-width: 1200px; margin: 0 auto; padding: 1.25rem 1.5rem;
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
    }
    .search-box { flex: 1; min-width: 220px; position: relative; }
    .search-box input {
      width: 100%; padding: 0.6rem 0.75rem 0.6rem 2.5rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .filter-btn {
      padding: 0.45rem 0.85rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-muted); font-size: 0.8rem;
      font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .filter-btn:hover { border-color: rgba(255,255,255,0.12); color: var(--text); }
    .filter-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .filter-btn .count {
      display: inline-block; margin-left: 0.3rem; padding: 0.1rem 0.4rem;
      border-radius: 6px; background: rgba(255,255,255,0.06); font-size: 0.7rem; font-weight: 600;
    }
    .filter-btn.active .count { background: rgba(96,205,255,0.2); }
    .stats { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 0.5rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .stat { font-size: 0.8rem; color: var(--text-muted); }
    .stat strong { color: var(--text); font-weight: 600; }
    .catalog { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 3rem; }
    .group { margin-top: 1.5rem; }
    .group-header {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
    }
    .group-header h2 { font-size: 1.05rem; font-weight: 600; }
    .group-badge { padding: 0.2rem 0.55rem; border-radius: 6px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-fix { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(251,191,36,0.2); }
    .badge-repack { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
    .badge-count { background: rgba(255,255,255,0.06); color: var(--text-muted); border: 1px solid var(--border); }
    .entry {
      display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem;
      border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
      margin-bottom: 0.5rem; transition: border-color 0.15s, background 0.15s;
    }
    .entry:hover { border-color: rgba(255,255,255,0.1); background: var(--surface-2); }
    .entry-info { flex: 1; min-width: 0; }
    .entry-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-meta { display: flex; gap: 0.75rem; margin-top: 0.2rem; font-size: 0.75rem; color: var(--text-muted); flex-wrap: wrap; }
    .entry-meta span { display: flex; align-items: center; gap: 0.25rem; }
    .entry-actions { display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0; }
    .dl-btn {
      display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.85rem;
      border-radius: 8px; border: none; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.15s; white-space: nowrap;
    }
    .dl-btn-primary { background: var(--accent); color: #000; }
    .dl-btn-primary:hover { background: #7dd6ff; transform: translateY(-1px); }
    .dl-btn-secondary { background: rgba(255,255,255,0.06); color: var(--text-muted); border: 1px solid var(--border); }
    .dl-btn-secondary:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
    .app-id {
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.75rem; color: var(--accent); background: var(--accent-dim);
      padding: 0.2rem 0.5rem; border-radius: 5px; white-space: nowrap; flex-shrink: 0;
    }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .empty-state p { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .footer { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.75rem; border-top: 1px solid var(--border); }
    @media (max-width: 640px) {
      .entry { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
      .entry-actions { width: 100%; }
      .dl-btn { flex: 1; justify-content: center; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>LumaForge</span> Fixes Catalog</h1>
    <p>Game fixes, cracks, and repacks</p>
  </div>
  <div class="controls">
    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search" placeholder="Search by name, AppID, or provider...">
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="catalog" id="catalog"></div>
  <div class="footer">LumaForge Fixes Catalog &middot; Data sourced from Rockstar Games &amp; Voices38</div>

  <script>
    const PROVIDERS = {
      "rockstar": { name: "Rockstar Games Fixes", icon: "\u{1F3AE}" },
      "voices38-cracks": { name: "Voices38 \u2014 Crack Only", icon: "\u{1F527}" },
      "voices38-repacks": { name: "Voices38 \u2014 Full Games", icon: "\u{1F4E6}" }
    };

    let data = null;
    let activeFilter = "all";
    let searchQuery = "";

    async function loadCatalog() {
      try {
        const resp = await fetch("catalog.json");
        data = await resp.json();
        renderFilters();
        render();
      } catch (e) {
        document.getElementById("catalog").innerHTML =
          '<div class="empty-state"><p>Failed to load catalog.</p><p style="font-size:0.85rem">' + e.message + '</p></div>';
      }
    }

    function getFiltered() {
      if (!data) return [];
      let entries = data.entries;
      if (activeFilter === "fixes") entries = entries.filter(e => e.type === "fix");
      else if (activeFilter === "repacks") entries = entries.filter(e => e.type === "repack");
      else if (activeFilter.startsWith("provider:")) {
        const p = activeFilter.slice(9);
        entries = entries.filter(e => e.provider === p);
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        entries = entries.filter(e =>
          e.title.toLowerCase().includes(q) ||
          e.appId.includes(q) ||
          e.provider.toLowerCase().includes(q) ||
          (e.tags && e.tags.some(t => t.includes(q)))
        );
      }
      return entries;
    }

    function renderFilters() {
      if (!data) return;
      const el = document.getElementById("filters");
      const counts = { all: data.entries.length, fixes: 0, repacks: 0 };
      const providerCounts = {};
      data.entries.forEach(e => {
        if (e.type === "fix") counts.fixes++;
        else counts.repacks++;
        providerCounts[e.provider] = (providerCounts[e.provider] || 0) + 1;
      });
      let html = '<button class="filter-btn active" data-filter="all">All <span class="count">' + counts.all + '</span></button>';
      html += '<button class="filter-btn" data-filter="fixes">Fixes <span class="count">' + counts.fixes + '</span></button>';
      html += '<button class="filter-btn" data-filter="repacks">Repacks <span class="count">' + counts.repacks + '</span></button>';
      html += '<button class="filter-btn" data-filter="provider:rockstar">Rockstar <span class="count">' + (providerCounts.rockstar || 0) + '</span></button>';
      html += '<button class="filter-btn" data-filter="provider:voices38-cracks">Voices38 Cracks <span class="count">' + (providerCounts["voices38-cracks"] || 0) + '</span></button>';
      html += '<button class="filter-btn" data-filter="provider:voices38-repacks">Voices38 Repacks <span class="count">' + (providerCounts["voices38-repacks"] || 0) + '</span></button>';
      el.innerHTML = html;
      el.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeFilter = btn.dataset.filter;
          el.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          render();
        });
      });
    }

    function render() {
      const entries = getFiltered();
      const catalog = document.getElementById("catalog");
      const statsEl = document.getElementById("stats");

      statsEl.innerHTML = '<div class="stat">Showing <strong>' + entries.length + '</strong> entries</div>';

      if (!entries.length) {
        catalog.innerHTML = '<div class="empty-state"><p>No entries found</p><p style="font-size:0.85rem">Try a different search or filter.</p></div>';
        return;
      }

      const groups = {};
      entries.forEach(e => {
        const key = e.provider;
        if (!groups[key]) groups[key] = [];
        groups[key].push(e);
      });

      let html = "";
      for (const [provider, items] of Object.entries(groups)) {
        const info = PROVIDERS[provider] || { name: provider, icon: "" };
        const firstType = items[0].type;
        const badgeClass = firstType === "fix" ? "badge-fix" : "badge-repack";
        html += '<div class="group">';
        html += '<div class="group-header">';
        html += '<h2>' + info.icon + " " + info.name + '</h2>';
        html += '<span class="group-badge badge-count">' + items.length + '</span>';
        html += '</div>';
        items.forEach(e => {
          html += '<div class="entry">';
          if (e.appId) html += '<span class="app-id">' + e.appId + '</span>';
          html += '<div class="entry-info">';
          html += '<div class="entry-title">' + esc(e.title) + '</div>';
          html += '<div class="entry-meta">';
          if (e.fileSizeHuman) html += '<span>\u{1F4BE} ' + esc(e.fileSizeHuman) + '</span>';
          if (e.installerType) html += '<span>\u{1F4C1} .' + esc(e.installerType) + '</span>';
          html += '<span class="group-badge ' + badgeClass + '">' + esc(firstType) + '</span>';
          html += '</div></div>';
          html += '<div class="entry-actions">';
          html += '<a class="dl-btn dl-btn-primary" href="' + esc(e.downloadUrl) + '" target="_blank" rel="noopener">\u{2B07} Download</a>';
          html += '</div></div>';
        });
        html += '</div>';
      }
      catalog.innerHTML = html;
    }

    function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

    document.getElementById("search").addEventListener("input", function() {
      searchQuery = this.value;
      render();
    });

    loadCatalog();
  </script>
</body>
</html>
