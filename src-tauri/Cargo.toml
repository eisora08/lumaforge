[package]
name = "lumaforge"
version = "1.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumaforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "native-tls", "json", "stream", "multipart"] }
zip = "2"
sevenz-rust = "0.6"
tempfile = "3"
walkdir = "2"
sha2 = "0.10"
open = { version = "5", features = ["shellexecute-on-windows"] }
base64 = "0.22"
sysinfo = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
urlencoding = "2.1"
notify = { version = "6", features = [] }
rfd = "0.15"
winreg = "0.52"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

tokio = { version = "1", features = ["sync", "time", "macros", "rt", "fs", "process", "io-util"] }

dashmap = "6"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
unrar = "0.5"
librqbit = "8"

goblin = "0.8"
scraper = "0.22"
chrono = "0.4"
aes-gcm = "0.10"
rand = "0.8"

futures = "0.3"
fs2 = "0.4"
anyhow = "1"
regex = "1"
flate2 = "1.0"
ureq = { version = "2", features = ["json"] }
libloading = "0.8"

windows = { version = "0.57", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "winuser", "processthreadsapi", "synchapi", "winbase", "handleapi"] }

